# SD1.5 experiment profile: more capacity and longer run
# Suggested output_dir: ./output/sd15/inaturalist/exp-high-rank

pretrained_model_name_or_path: runwayml/stable-diffusion-v1-5

lora_rank: 8
lora_alpha: 64
lora_dropout: 0.05

learning_rate: 8e-5
train_batch_size: 2
gradient_accumulation_steps: 4
max_train_steps: 3000
save_steps: 500

mixed_precision: fp16
seed: 42
enable_xformers_memory_efficient_attention: true
dataloader_num_workers: 2

report_to: wandb
wandb_project: trees-sd-experiments
wandb_entity: null
wandb_run_name: sd15-inaturalist-exp-high-rank
wandb_api_key: null
