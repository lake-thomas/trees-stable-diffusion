# SD1.5 baseline on Autoarborist
# Use with:
# trees-sd-train --data_dir /path/to/autoarborist --dataset_type autoarborist --model_version sd1.5 --config trees_sd/configs/sd15_autoarborist.yaml --output_dir ./output/sd15/autoarborist/baseline

pretrained_model_name_or_path: runwayml/stable-diffusion-v1-5

lora_rank: 4
lora_alpha: 32
lora_dropout: 0.1

learning_rate: 1e-4
train_batch_size: 1
gradient_accumulation_steps: 4
max_train_steps: 1500
save_steps: 250

mixed_precision: fp16
seed: 42
dataloader_num_workers: 0

report_to: none
wandb_project: null
wandb_entity: null
wandb_run_name: sd15-autoarborist-baseline
wandb_api_key: null
