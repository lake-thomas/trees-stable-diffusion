# SD1.5 baseline on iNaturalist
# Use with:
# trees-sd-train --data_dir /path/to/inaturalist --dataset_type inaturalist --model_version sd1.5 --config trees_sd/configs/sd15_inaturalist.yaml --output_dir ./output/sd15/inaturalist/baseline

pretrained_model_name_or_path: runwayml/stable-diffusion-v1-5

lora_rank: 4
lora_alpha: 32
lora_dropout: 0.1

learning_rate: 1e-4
train_batch_size: 1
gradient_accumulation_steps: 4
max_train_steps: 1000
save_steps: 250

mixed_precision: fp16
seed: 42
enable_xformers_memory_efficient_attention: false
dataloader_num_workers: 0

report_to: none
wandb_project: null
wandb_entity: null
wandb_run_name: sd15-inaturalist-baseline
wandb_api_key: null
